# docker compose up -d   →   http://localhost:7700 (first visit asks you to set a password)
services:
  fretforge:
    image: ghcr.io/goglesquirmintontheiii/fretforge:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "7700:7700"
    volumes:
      - ./data:/data
      - ./library:/library   # put your Guitar Pro / MusicXML / MIDI files here
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7700/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
