name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release with this tag (e.g. v0.2.0). Leave empty for a dry run.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the audio engine (WASM + native addon)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wasi-libc libc++-18-dev-wasm32 libclang-rt-18-dev-wasm32
          bash packages/engine/build.sh all
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the web app
        run: |
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs --shots smoke-shots
      - name: Package the desktop app
        run: |
          npm run build -w @fretforge/desktop
          cd packages/desktop && npx electron-builder --linux --dir
      - name: Build the AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          bash scripts/build-appimage.sh
      - name: Self-test the unpacked app
        run: |
          export FRETFORGE_SELFTEST="$PWD/smoke-shots/unpacked.png" FRETFORGE_DATA="$RUNNER_TEMP/ff-data-u" FRETFORGE_LIBRARY="$RUNNER_TEMP/ff-lib-u"
          set +e
          timeout 150 xvfb-run -a -s "-screen 0 1400x900x24" packages/desktop/release/linux-unpacked/fretforge --no-sandbox > unpacked.log 2>&1
          code=$?
          set -e
          if ! grep -q "SELFTEST OK" unpacked.log; then
            msg=$(tail -c 3500 unpacked.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Unpacked app self-test (exit $code)::$msg"
            exit 1
          fi
      - name: Self-test the AppImage
        run: |
          APP=$(ls release/Fretforge-*-x86_64.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1 FRETFORGE_SELFTEST="$PWD/smoke-shots/appimage.png" FRETFORGE_DATA="$RUNNER_TEMP/ff-data" FRETFORGE_LIBRARY="$RUNNER_TEMP/ff-lib"
          set +e
          timeout 240 xvfb-run -a -s "-screen 0 1400x900x24" "$APP" > selftest.log 2>&1
          code=$?
          set -e
          if ! grep -q "SELFTEST OK" selftest.log; then
            msg=$(tail -c 3500 selftest.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=AppImage self-test (exit $code)::$msg"
            exit 1
          fi
          echo "::notice title=AppImage self-test::$(grep SELFTEST selftest.log)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-screenshots
          path: smoke-shots
          if-no-files-found: ignore
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          # creates the tag on this commit when it doesn't exist yet
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Fretforge ${TAG#v}" --notes-file "$NOTES"
          gh release upload "$TAG" release/*.AppImage release/*.sha256 --clobber

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: appimage
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.name.outputs.image }}:${{ inputs.tag || github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
