name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the audio engine (WASM + native addon)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wasi-libc libc++-18-dev-wasm32 libclang-rt-18-dev-wasm32
          bash packages/engine/build.sh all
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AI worker tests
        run: |
          pip install numpy soundfile librosa
          python -m unittest ai/test_ai.py -v
      - run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: node scripts/smoke.mjs --shots smoke-shots && node scripts/smoke-gear.mjs smoke-shots/gear
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore
