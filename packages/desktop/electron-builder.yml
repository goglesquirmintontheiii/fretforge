# electron-builder produces the unpacked app; scripts/build-appimage.sh turns it into an AppImage
# with the static AppImage runtime (no libfuse2 needed, works on Fedora/Nobara out of the box).
appId: dev.fretforge.app
productName: Fretforge
electronVersion: 44.9.3
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: resources/icon.png
    to: icon.png
  - from: native
    to: native
    filter: ['*.node']
  - from: ../../ai
    to: ai
    filter: ['*.py', '*.wav', 'README.md']
asar: true
npmRebuild: false
nodeGypRebuild: false
linux:
  target: dir
  executableName: fretforge
  category: Audio
  icon: build/icon.png
